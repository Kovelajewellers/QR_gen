<script>

    // ==========================================
    // KOVELA JEWELLERS - ONE QR PER DEVICE
    // ==========================================


    // Get the saved number from this browser/device
    const savedNumber = localStorage.getItem("kovelaGeneratedNumber");


    // Get the page elements
    const numberElement = document.getElementById("number");
    const qrCode = document.getElementById("qrCode");
    const generateButton = document.getElementById("generateButton");


    // ==========================================
    // IF QR WAS ALREADY GENERATED
    // ==========================================

    if (savedNumber !== null) {

        // Show the previously generated number
        numberElement.textContent = savedNumber;


        // Create the QR code again
        const qrUrl =
            "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
            + encodeURIComponent(savedNumber);


        // Display the QR code
        qrCode.src = qrUrl;
        qrCode.style.display = "block";


        // Disable the Generate QR button
        generateButton.disabled = true;

        generateButton.textContent =
            "QR Already Generated";

    }


    // ==========================================
    // GENERATE QR FUNCTION
    // ==========================================

    function generateQR() {

        // Check if this device has already generated a QR
        const existingNumber =
            localStorage.getItem("kovelaGeneratedNumber");


        // If already generated, stop
        if (existingNumber !== null) {

            return;

        }


        // ==========================================
        // GENERATE RANDOM NUMBER 0 - 19
        // ==========================================

        const randomNumber =
            Math.floor(Math.random() * 20);


        // ==========================================
        // SAVE NUMBER TO THIS DEVICE/BROWSER
        // ==========================================

        localStorage.setItem(
            "kovelaGeneratedNumber",
            randomNumber
        );


        // ==========================================
        // DISPLAY NUMBER
        // ==========================================

        numberElement.textContent = randomNumber;


        // ==========================================
        // CREATE QR CODE
        // ==========================================

        const qrUrl =
            "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
            + encodeURIComponent(randomNumber);


        // Set QR image
        qrCode.src = qrUrl;


        // Show QR image
        qrCode.style.display = "block";


        // ==========================================
        // DISABLE BUTTON
        // ==========================================

        generateButton.disabled = true;

        generateButton.textContent =
            "QR Already Generated";

    }

</script>
