<script>

    // ==========================================
    // KOVELA JEWELLERS - ONE QR PER DEVICE
    // ==========================================


    // ==========================================
    // ADD DISABLED BUTTON STYLE
    // ==========================================

    const style = document.createElement("style");

    style.textContent = `
        button:disabled {
            background: #999 !important;
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }
    `;

    document.head.appendChild(style);


    // ==========================================
    // GET SAVED NUMBER
    // ==========================================

    const savedNumber =
        localStorage.getItem("kovelaGeneratedNumber");


    // ==========================================
    // GET PAGE ELEMENTS
    // ==========================================

    const numberElement =
        document.getElementById("number");

    const qrCode =
        document.getElementById("qrCode");

    const generateButton =
        document.getElementById("generateButton");


    // ==========================================
    // CHECK IF QR WAS ALREADY GENERATED
    // ==========================================

    if (savedNumber !== null) {

        // Show previously generated number
        numberElement.textContent =
            savedNumber;


        // Create QR code URL
        const qrUrl =
            "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
            + encodeURIComponent(savedNumber);


        // Display QR code
        qrCode.src = qrUrl;

        qrCode.style.display =
            "block";


        // Disable button
        generateButton.disabled =
            true;

        generateButton.textContent =
            "QR Already Generated";

    }


    // ==========================================
    // GENERATE QR FUNCTION
    // ==========================================

    function generateQR() {


        // ==========================================
        // CHECK AGAIN
        // ==========================================

        const existingNumber =
            localStorage.getItem(
                "kovelaGeneratedNumber"
            );


        // If QR already exists, stop
        if (existingNumber !== null) {

            return;

        }


        // ==========================================
        // GENERATE RANDOM NUMBER 0 - 19
        // ==========================================

        const randomNumber =
            Math.floor(Math.random() * 20);


        // ==========================================
        // SAVE NUMBER
        // ==========================================

        localStorage.setItem(
            "kovelaGeneratedNumber",
            randomNumber
        );


        // ==========================================
        // DISPLAY NUMBER
        // ==========================================

        numberElement.textContent =
            randomNumber;


        // ==========================================
        // CREATE QR CODE
        // ==========================================

        const qrUrl =
            "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
            + encodeURIComponent(randomNumber);


        // ==========================================
        // DISPLAY QR CODE
        // ==========================================

        qrCode.src =
            qrUrl;

        qrCode.style.display =
            "block";


        // ==========================================
        // DISABLE BUTTON
        // ==========================================

        generateButton.disabled =
            true;

        generateButton.textContent =
            "QR Already Generated";

    }

</script>
